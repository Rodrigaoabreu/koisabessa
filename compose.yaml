services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: koisabessa
      MYSQL_USER: koisabessa
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-koisabessa_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-koisabessa_root_local}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  mysql-data:
