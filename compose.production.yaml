services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: koisabessa
      DB_USER: koisabessa
      DB_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/app/backend/storage/uploads

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: koisabessa
      MYSQL_USER: koisabessa
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -N -e "SELECT 1"'
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s

volumes:
  mysql-data:
  uploads:
